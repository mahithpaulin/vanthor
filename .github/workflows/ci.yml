name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compiler versions
        run: |
          g++ --version
          clang++ --version || true
          cmake --version
      - name: configure (g++)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build -j2
      - name: sha256
        run: sha256sum build/vanthor
      - name: UCI smoke test
        run: python3 tests/test_uci.py --engine ./build/vanthor
      - name: perft regression (exact node counts)
        run: python3 tests/test_perft.py --engine ./build/vanthor
      - name: elo self-check
        run: python3 tools/elo.py --self-check
      - name: tournament self-test
        run: python3 tools/tournament.py --self-test --out tournaments/self-test && cat tournaments/self-test/summary.txt
      - name: bench smoke (deterministic nodes)
        run: printf 'bench\nquit\n' | timeout 120 ./build/vanthor
      - name: clang build (no test, warnings check)
        run: |
          cmake -S . -B build-clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build build-clang -j2
  tactics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: python-chess
        run: pip install python-chess
      - name: WAC suite @200k nodes (floor 230/300)
        run: python3 tools/run_suite.py --engine ./build/vanthor --epd tests/wacnew.epd --nodes 200000 --min-solved 230
      - name: self-play smoke (4 games, paired book)
        run: python3 tools/play_match.py --white ./build/vanthor --black ./build/vanthor --games 4 --movetime 50 --name-white dev --name-black dev
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure (ASan+UBSan)
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DVANTHOR_SANITIZE=ON
      - name: build
        run: cmake --build build-san -j2
      - name: UCI smoke under sanitizers
        run: python3 tests/test_uci.py --engine ./build-san/vanthor
      - name: perft under sanitizers
        run: python3 tests/test_perft.py --engine ./build-san/vanthor
